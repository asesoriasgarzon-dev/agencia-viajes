{% extends "base.html" %}
{% block title %}Usuarios{% endblock %}
{% block content %}
<div class="card">
  <h2>Crear usuario</h2>
  <form method="post">
    <div class="grid2">
      <div>
        <label>Usuario</label>
        <input type="text" name="username" required>
      </div>
      <div>
        <label>Contraseña</label>
        <input type="text" name="password" required>
      </div>
      <div>
        <label>Nombre completo</label>
        <input type="text" name="nombre" required>
      </div>
      <div>
        <label>Rol</label>
        <select name="rol">
          {% for r in roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <button type="submit" style="margin-top:12px;">Crear usuario</button>
  </form>
</div>

<div class="card">
  <h2>Usuarios existentes ({{ usuarios|length }})</h2>
  <table>
    <tr><th>Usuario</th><th>Nombre</th><th>Rol</th></tr>
    {% for u in usuarios %}
    <tr>
      <td>{{ u.username }}</td>
      <td>{{ u.nombre }}</td>
      <td><span class="badge">{{ u.rol }}</span></td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
